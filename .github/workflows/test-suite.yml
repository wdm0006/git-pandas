# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: "Test Suite and Linting"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "test (py${{ matrix.python-version }}, pandas ${{ matrix.pandas-major }}.x)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pandas 3 requires Python >= 3.11, so the 3.10 entry can only ever be pandas 2.
        include:
          - python-version: '3.10'
            pandas-major: '2'
            pandas-spec: '>=2.0,<3.0'
          - python-version: '3.11'
            pandas-major: '2'
            pandas-spec: '>=2.0,<3.0'
          - python-version: '3.12'
            pandas-major: '2'
            pandas-spec: '>=2.0,<3.0'
          - python-version: '3.12'
            pandas-major: '3'
            pandas-spec: '>=3.0,<4.0'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Check uv version
      run: uv --version
    
    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"
        uv pip install --system "pandas${{ matrix.pandas-spec }}"

    # Fail loudly rather than silently testing the wrong major.
    - name: Verify pandas version
      run: |
        python -c "
        import pandas
        print('pandas', pandas.__version__)
        assert pandas.__version__.split('.')[0] == '${{ matrix.pandas-major }}', pandas.__version__
        "

    - name: Configure Git
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Run tests
      run: |
        MPLBACKEND=Agg python -m pytest -v -m "not slow"

    - name: Run linting
      run: |
        python -m ruff check .
